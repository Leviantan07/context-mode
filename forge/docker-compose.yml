# V1 local dev stack: Postgres + the API (which drives the worker in-process
# — see docs/ARCHITECTURE.md → Task Manager). The dashboard is static files,
# served by any static file server / opened directly; no container needed.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
    ports:
      - "8787:8787"
    volumes:
      # The repo the worker operates on — see FORGE_REPO_PATH in .env.example.
      - ${FORGE_REPO_PATH:-./repo}:/repo

volumes:
  forge-postgres-data:
